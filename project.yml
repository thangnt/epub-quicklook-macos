name: EPUBQuickLook
options:
  bundleIdPrefix: com.ebookreviews
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 15.0
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CLANG_MODULE_CACHE_PATH: /private/tmp/epubql-clang-cache
targets:
  EPUBQuickLook:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebookreviews.EPUBQuickLook
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: EPUB Quick Look
        CODE_SIGN_ENTITLEMENTS: App/EPUBQuickLook.entitlements
    dependencies:
      - target: EPUBPreview
        embed: true
  EPUBPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ebookreviews.EPUBQuickLook.Preview
        INFOPLIST_FILE: PreviewExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: EPUBPreview
        CODE_SIGN_ENTITLEMENTS: PreviewExtension/EPUBPreview.entitlements
        SKIP_INSTALL: YES
